# Dependabot (since 2.21.25): proposes updates of the dev dependencies and GitHub Actions as pull requests.
# The CI tests every pull request (npm works there); the monthly technical check merges green ones.
# A new Playwright version also needs the matching container image in .github/workflows/test.yml
# (tests/ci.test.js checks this) – the technical check pushes that change onto the Dependabot branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [abhaengigkeiten]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [abhaengigkeiten]
