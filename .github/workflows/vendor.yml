name: Abhängigkeiten bereitstellen

# Manually triggered: installs the dev dependencies and provides
# package-lock.json and the Chart.js UMD build as a downloadable artifact
# (for environments without npm registry access).
on:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          mkdir -p out/vendor
          cp package-lock.json out/
          cp node_modules/chart.js/dist/chart.umd.js out/vendor/chart.umd.min.js
          cp node_modules/chart.js/LICENSE.md out/vendor/chart.js-LICENSE.md
          node -p "'chart.js ' + JSON.parse(require('fs').readFileSync('node_modules/chart.js/package.json','utf8')).version" > out/vendor/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: out/
