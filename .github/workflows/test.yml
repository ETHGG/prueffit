name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes older runs obsolete; hung runs end after a fixed time.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit-Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: npm test (andere Gerätezeitzone)
        run: npm test
        env:
          TZ: America/Los_Angeles

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    name: Browsertests (Playwright, Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The Ubuntu package mirror sometimes stalls; give the install a time limit and one more try.
      - id: pwinstall
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 6
        continue-on-error: true
      - if: steps.pwinstall.outcome == 'failure'
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 8
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
