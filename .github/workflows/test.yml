name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes older runs obsolete; hung runs end after a fixed time.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit-Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: npm test (andere Gerätezeitzone)
        run: npm test
        env:
          TZ: America/Los_Angeles

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    name: Browsertests (Playwright, Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright image with browsers and system libraries preinstalled: no apt downloads
    # (the Ubuntu mirror stalled several times). Keep the tag equal to the playwright version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
