<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Dezimale und binäre Einheiten im Vergleich</title>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<text x="600" y="70" font-size="46" fill="#10201f" font-weight="700" text-anchor="middle">Dezimal (SI) und binär (IEC)</text>
<text x="300" y="150" font-size="38" fill="#0f766e" font-weight="700" text-anchor="middle">Faktor 1.000 = 10³</text>
<text x="900" y="150" font-size="38" fill="#0f766e" font-weight="700" text-anchor="middle">Faktor 1.024 = 2¹⁰</text>
<rect x="60" y="190" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="90" y="252" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">kB</text>
<text x="510" y="252" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.000 Byte</text>
<rect x="660" y="190" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="690" y="252" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">KiB</text>
<text x="1110" y="252" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.024 Byte</text>
<rect x="60" y="302" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="90" y="364" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">MB</text>
<text x="510" y="364" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.000 kB</text>
<rect x="660" y="302" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="690" y="364" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">MiB</text>
<text x="1110" y="364" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.024 KiB</text>
<rect x="60" y="414" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="90" y="476" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">GB</text>
<text x="510" y="476" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.000 MB</text>
<rect x="660" y="414" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="690" y="476" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">GiB</text>
<text x="1110" y="476" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.024 MiB</text>
<rect x="60" y="526" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="90" y="588" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">TB</text>
<text x="510" y="588" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.000 GB</text>
<rect x="660" y="526" width="480" height="92" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="690" y="588" font-size="48" fill="#10201f" font-weight="700" text-anchor="start">TiB</text>
<text x="1110" y="588" font-size="40" fill="#10201f" font-weight="400" text-anchor="end">1.024 GiB</text>
<text x="600" y="690" font-size="40" fill="#10201f" font-weight="700" text-anchor="middle">1 TB = 10¹² Byte ≈ 931 GiB (≈ 0,91 TiB)</text>
<text x="600" y="750" font-size="36" fill="#4b5d5c" font-weight="400" text-anchor="middle">1 Byte = 8 Bit · Datenraten in Bit/s, Dateien in Byte</text>
</svg>
