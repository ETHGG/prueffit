<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Klassendiagramm mit Assoziation, Multiplizitäten und Vererbung</title>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<text x="600" y="70" font-size="46" fill="#10201f" font-weight="700" text-anchor="middle">UML-Klassendiagramm</text>
<rect x="60" y="110" width="440" height="248" fill="#ffffff" stroke="#10201f" stroke-width="4"/>
<line x1="60" y1="180" x2="500" y2="180" stroke="#10201f" stroke-width="3"/>
<line x1="60" y1="292" x2="500" y2="292" stroke="#10201f" stroke-width="3"/>
<text x="280.0" y="158" font-size="40" fill="#10201f" font-weight="700" text-anchor="middle">Kunde</text>
<text x="80" y="226" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">- kundenNr: int</text>
<text x="80" y="272" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">- name: String</text>
<text x="80" y="338" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">+ bestellen(): void</text>
<rect x="700" y="110" width="440" height="248" fill="#ffffff" stroke="#10201f" stroke-width="4"/>
<line x1="700" y1="180" x2="1140" y2="180" stroke="#10201f" stroke-width="3"/>
<line x1="700" y1="292" x2="1140" y2="292" stroke="#10201f" stroke-width="3"/>
<text x="920.0" y="158" font-size="40" fill="#10201f" font-weight="700" text-anchor="middle">Bestellung</text>
<text x="720" y="226" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">- bestellNr: int</text>
<text x="720" y="272" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">- datum: Date</text>
<text x="720" y="338" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">+ summe(): double</text>
<rect x="60" y="520" width="440" height="156" fill="#ffffff" stroke="#10201f" stroke-width="4"/>
<line x1="60" y1="590" x2="500" y2="590" stroke="#10201f" stroke-width="3"/>
<line x1="60" y1="656" x2="500" y2="656" stroke="#10201f" stroke-width="3"/>
<text x="280.0" y="568" font-size="40" fill="#10201f" font-weight="700" text-anchor="middle">Geschäftskunde</text>
<text x="80" y="636" font-size="34" fill="#10201f" font-weight="400" text-anchor="start">- ustIdNr: String</text>
<line x1="500" y1="260" x2="700" y2="260" stroke="#10201f" stroke-width="4"/>
<text x="515" y="245" font-size="36" fill="#10201f" font-weight="700" text-anchor="start">1</text>
<text x="690" y="245" font-size="36" fill="#10201f" font-weight="700" text-anchor="end">0..*</text>
<text x="600" y="310" font-size="32" fill="#4b5d5c" font-weight="400" text-anchor="middle">gibt auf</text>
<line x1="280" y1="520" x2="280" y2="398" stroke="#10201f" stroke-width="4"/>
<polygon points="280,358 250,402 310,402" fill="#ffffff" stroke="#10201f" stroke-width="4"/>
<text x="300" y="480" font-size="32" fill="#4b5d5c" font-weight="400" text-anchor="start">Vererbung</text>
<text x="580" y="560" font-size="32" fill="#10201f" font-weight="400" text-anchor="start">Sichtbarkeit: − privat, + öffentlich,</text>
<text x="580" y="604" font-size="32" fill="#10201f" font-weight="400" text-anchor="start"># geschützt</text>
<text x="580" y="664" font-size="32" fill="#10201f" font-weight="400" text-anchor="start">Multiplizität: 1, 0..1, 0..*, 1..*</text>
<text x="580" y="724" font-size="32" fill="#10201f" font-weight="400" text-anchor="start">Leeres Dreieck zeigt zur Oberklasse</text>
</svg>
