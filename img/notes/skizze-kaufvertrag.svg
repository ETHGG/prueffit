<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Kaufvertrag aus Antrag und Annahme, danach Pflichten und Erfüllung</title>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<text x="600" y="70" font-size="46" fill="#10201f" font-weight="700" text-anchor="middle">Kaufvertrag: Abschluss, Pflichten, Erfüllung</text>
<rect x="60" y="120" width="470" height="120" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="295" y="172" font-size="44" fill="#10201f" font-weight="700" text-anchor="middle">Antrag</text>
<text x="295" y="218" font-size="34" fill="#4b5d5c" font-weight="400" text-anchor="middle">1. Willenserklärung</text>
<rect x="670" y="120" width="470" height="120" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="905" y="172" font-size="44" fill="#10201f" font-weight="700" text-anchor="middle">Annahme</text>
<text x="905" y="218" font-size="34" fill="#4b5d5c" font-weight="400" text-anchor="middle">2. Willenserklärung</text>
<text x="600" y="192" font-size="60" fill="#0f766e" font-weight="700" text-anchor="middle">+</text>
<line x1="600" y1="250" x2="600" y2="300" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="1080" height="230" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
<text x="600" y="362" font-size="42" fill="#0f766e" font-weight="700" text-anchor="middle">Kaufvertrag = Verpflichtungsgeschäft</text>
<text x="90" y="420" font-size="36" fill="#10201f" font-weight="700" text-anchor="start">Verkäufer muss:</text>
<text x="90" y="466" font-size="36" fill="#10201f" font-weight="400" text-anchor="start">Ware übergeben und</text>
<text x="90" y="510" font-size="36" fill="#10201f" font-weight="400" text-anchor="start">Eigentum verschaffen</text>
<text x="640" y="420" font-size="36" fill="#10201f" font-weight="700" text-anchor="start">Käufer muss:</text>
<text x="640" y="466" font-size="36" fill="#10201f" font-weight="400" text-anchor="start">Kaufpreis zahlen und</text>
<text x="640" y="510" font-size="36" fill="#10201f" font-weight="400" text-anchor="start">Ware abnehmen</text>
<line x1="600" y1="550" x2="600" y2="600" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="60" y="610" width="1080" height="150" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/>
<text x="600" y="662" font-size="42" fill="#0f766e" font-weight="700" text-anchor="middle">Erfüllungsgeschäft</text>
<text x="600" y="720" font-size="36" fill="#10201f" font-weight="400" text-anchor="middle">Übergabe + Einigung über das Eigentum · Zahlung</text>
</svg>
