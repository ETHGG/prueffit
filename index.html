<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PrüfFit – AP1/AP2-Lerntrainer</title>
  <meta name="description" content="PrüfFit: Offline-Lerntrainer für die IHK-Abschlussprüfungen AP1 und AP2 der IT-Berufe.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1416" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PrüfFit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script>
    // Apply a manually chosen theme before the first paint (no flash of the wrong theme).
    try {
      var t = JSON.parse(localStorage.getItem('prueffit.v1') || '{}').settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* default: follow the system */ }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Zum Inhalt springen</a>

  <header class="app-header">
    <a class="brand" href="#/start" aria-label="PrüfFit – Startseite">
      <img src="./icons/icon-192.png" alt="" width="28" height="28">
      <span>PrüfFit</span>
    </a>
    <a class="icon-button" href="#/einstellungen" aria-label="Einstellungen" data-route="einstellungen">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </a>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="loading">PrüfFit wird geladen …</p>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/start" data-route="start">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3L12 3Z"/></svg>
      <span>Start</span>
    </a>
    <a href="#/quiz" data-route="quiz">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 17h-2v-2h2v2Zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3A2 2 0 0 0 12 7a2 2 0 0 0-2 2H8a4 4 0 1 1 7.1 2.3Z"/></svg>
      <span>Quiz</span>
    </a>
    <a href="#/karten" data-route="karten">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 6h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm4-4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2V4H8a2 2 0 0 1 0-2Z"/></svg>
      <span>Karten</span>
    </a>
    <a href="#/statistik" data-route="statistik">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 20V10h4v10H4Zm6 0V4h4v16h-4Zm6 0v-7h4v7h-4Z"/></svg>
      <span>Statistik</span>
    </a>
    <a href="#/pruefung" data-route="pruefung">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7Z"/></svg>
      <span>Prüfung</span>
    </a>
  </nav>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button secondary" id="confirm-cancel">Abbrechen</button>
        <button value="ok" class="button danger" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <noscript>
    <p class="noscript">PrüfFit benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.</p>
  </noscript>
</body>
</html>
